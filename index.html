<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semaforo Agenti</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7d1a3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f4f1;--surface:#fff;--fg:#1f2421;--muted:#5f6862;--line:#d9ddd7;--accent:#7d1a3c;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:16px/1.4 "Segoe UI",system-ui,sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:100%;max-width:360px;text-align:center}
img{height:72px;width:auto;margin-bottom:12px}
h1{font-size:18px;margin:0 0 18px}
input[type=password]{width:100%;padding:12px;font-size:16px;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px;color:var(--muted);margin-bottom:14px}
button{width:100%;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f" hidden>
  <img src="logo.png" alt="Universal Caffè dal 1963">
  <h1>Semaforo Agenti</h1>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus>
  <label><input id="rem" type="checkbox" checked> Ricorda su questo dispositivo</label>
  <button id="b">Entra</button>
  <div id="err"></div>
</form>

const K='semaforo-pw';
const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
async function apri(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  document.open();document.write(html);document.close();
}
const ls={get(){try{return localStorage.getItem(K)}catch(e){return null}},set(v){try{localStorage.setItem(K,v)}catch(e){}},del(){try{localStorage.removeItem(K)}catch(e){}}};
const f=document.getElementById('f');
f.addEventListener('submit',async e=>{
  e.preventDefault();const b=document.getElementById('b'),err=document.getElementById('err'),pw=document.getElementById('pw').value;
  b.disabled=true;b.textContent='Verifica…';err.textContent='';
  try{if(document.getElementById('rem').checked)ls.set(pw);await apri(pw)}
  catch(x){ls.del();err.textContent='Password non corretta';b.disabled=false;b.textContent='Entra'}
});
const salvata=ls.get();
if(salvata){apri(salvata).catch(()=>{ls.del();f.hidden=false})}else{f.hidden=false}
</script>
